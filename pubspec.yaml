name: daleel
description: دليل - تطبيق قانوني شامل للسعودية ومصر والأردن والإمارات والكويت
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1

  # State Management
  provider: ^6.1.1

  # Navigation
  go_router: ^13.0.0

  # Storage & Auth
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Network
  http: ^1.1.2
  dio: ^5.4.0

  # Files & Documents
  file_picker: ^6.1.1
  path_provider: ^2.1.2
  open_filex: ^4.3.4

  # PDF
  pdf: ^3.10.7
  printing: ^5.11.1

  # UI Helpers
  intl: ^0.19.0
  flutter_spinkit: ^5.2.0
  another_flushbar: ^1.12.30

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/

  # fonts:
  #   - family: Cairo
  #     fonts:
  #       - asset: assets/fonts/Cairo-Regular.ttf
  #       - asset: assets/fonts/Cairo-Bold.ttf
  #         weight: 700
